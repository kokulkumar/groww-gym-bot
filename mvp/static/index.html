<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groww Gym Bot</title>
<style>
  :root{
    --bg:#fff; --ink:#44475b; --ink-strong:#2c2e3e; --muted:#6b6e7e; --faint:#777a89;
    --line:#ebebf0; --green:#00b386; --green-soft:#e6f7f2; --blue:#5367ff; --pos:#00b386;
    --stage:#e9eaee; --card:#fff; --shadow:0 20px 60px rgba(30,32,50,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:var(--stage);color:var(--ink);font-family:Inter,"SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .stage{min-height:100%;display:flex;align-items:center;justify-content:center}
  .phone{position:relative;width:390px;height:844px;max-height:100vh;background:var(--bg);overflow:hidden;border-radius:36px;box-shadow:var(--shadow);display:flex;flex-direction:column}
  @media (max-width:480px){
    .stage{display:block}
    .phone{width:100%;height:100vh;height:100dvh;max-height:none;border-radius:0;box-shadow:none}
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  svg{display:block}

  /* screens */
  .screen{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
  .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .scroll::-webkit-scrollbar{display:none}

  /* header */
  .top{display:flex;align-items:center;gap:12px;padding:22px 20px 14px}
  .top .logo{width:36px;height:36px;border-radius:50%}
  .top h1{margin:0;font-size:clamp(15px,4.8vw,19px);font-weight:600;color:var(--ink-strong);letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top{gap:6px!important}.top .icon-btn{width:34px;height:34px}
  .icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--ink-strong)}
  .icon-btn:active{background:#f3f3f6}
  .tabs{display:flex;gap:6px;padding:0 12px;border-bottom:1px solid var(--line)}
  .tab{padding:12px 10px 11px;font-size:15px;font-weight:600;color:var(--faint);position:relative}
  .tab.on{color:var(--ink-strong)}
  .tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--ink-strong)}

  /* sections */
  .sec{padding:26px 20px 8px}
  .sec h2{margin:0;font-size:18px;font-weight:600;color:var(--ink-strong);letter-spacing:-.01em}
  .sec p{margin:4px 0 0;font-size:13px;color:var(--muted)}
  .thead{display:flex;justify-content:space-between;padding:18px 20px 6px;font-size:12.5px;color:var(--muted)}
  .thead .r{color:var(--green);font-weight:600}
  .fund{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 20px;border-top:1px solid var(--line)}
  .fund:first-of-type{border-top:0}
  .fund:active{background:#fafafc}
  .fund .ic{width:44px;height:44px;border-radius:12px;background:#f4f5f8;display:grid;place-items:center;flex:none}
  .fund .ic img{width:30px;height:30px;border-radius:50%}
  .fund .nm{flex:1;min-width:0}
  .fund .nm b{display:block;font-weight:500;font-size:15.5px;color:var(--ink-strong);line-height:1.3}
  .fund .nm span{display:block;margin-top:3px;font-size:12.5px;color:var(--muted)}
  .fund .rt{font-size:15.5px;font-weight:500;color:var(--ink-strong);text-align:right;white-space:nowrap}
  .fund .rt small{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:2px}
  .foot{padding:18px 20px 120px;font-size:11.5px;color:var(--faint);line-height:1.5}

  /* bottom nav */
  .nav{display:flex;border-top:1px solid var(--line);background:#fff;padding:8px 6px calc(10px + env(safe-area-inset-bottom));position:relative;z-index:5}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--faint);padding:4px 0}
  .nav button.on{color:var(--blue)}
  .nav svg{width:26px;height:26px}

  /* Ask the Coach orb */
  .coach{position:absolute;right:14px;bottom:84px;width:66px;height:66px;border-radius:50%;background:transparent;z-index:6;padding:0}
  .coach canvas{width:100%;height:100%;display:block}
  .coach:active{transform:scale(.96)}
  #s-scheme ~ .coach{bottom:96px}

  /* prototype note */
  .note{position:absolute;top:70px;right:16px;left:16px;z-index:20;background:var(--ink-strong);color:#fff;border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.5;box-shadow:0 12px 30px rgba(0,0,0,.25);display:none}
  .note.show{display:block}
  .note b{display:block;margin-bottom:4px;font-size:13.5px}


  /* scheme page */
  .sbar{display:flex;align-items:center;gap:6px;padding:20px 12px 8px;min-height:64px}
  .sbar .t{flex:1;min-width:0;opacity:0;transition:opacity .15s}
  .sbar .t b{display:block;font-size:14.5px;font-weight:600;color:var(--ink-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sbar .t span{font-size:12px;color:var(--pos)}
  .sbar.on{border-bottom:1px solid var(--line)} .sbar.on .t{opacity:1}
  .shead{padding:6px 20px 0}
  .shead .ic{width:48px;height:48px;border-radius:12px;background:#f4f5f8;display:grid;place-items:center}
  .shead .ic img{width:34px;height:34px;border-radius:50%}
  .shead h2{margin:22px 0 8px;font-size:22px;line-height:1.3;font-weight:600;color:var(--ink-strong);letter-spacing:-.015em}
  .tags{font-size:14px;color:var(--muted)}
  .tags i{font-style:normal;margin:0 7px;color:var(--faint)}
  .big{margin-top:20px;display:flex;align-items:baseline;gap:8px}
  .big b{font-size:30px;font-weight:600;color:var(--pos);letter-spacing:-.02em}
  .big b.na{color:var(--ink-strong)}
  .big span{font-size:13px;color:var(--muted)}
  .chart{margin:10px 8px 0}
  .chart svg{width:100%;height:230px;overflow:visible}
  .chart path{fill:none;stroke:var(--green);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .ranges{display:flex;justify-content:space-between;padding:14px 20px 0}
  .rg{min-width:50px;padding:11px 0;border-radius:999px;border:1px solid transparent;font-size:14.5px;color:var(--muted);text-align:center}
  .rg.on{border-color:var(--green);color:var(--green);background:var(--green-soft)}
  .cap{padding:10px 20px 0;font-size:11.5px;color:var(--faint)}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;padding:26px 20px 24px}
  .facts small{display:block;font-size:13px;color:var(--muted)}
  .facts b{display:block;margin-top:6px;font-size:17px;font-weight:500;color:var(--ink-strong)}
  .facts em{font-style:normal;font-size:11.5px;color:var(--faint);font-weight:400;margin-left:4px}
  .acc{border-top:1px solid var(--line)}
  .acc button.h{display:flex;align-items:center;justify-content:space-between;width:100%;padding:22px 20px;font-size:17px;font-weight:500;color:var(--ink-strong);text-align:left}
  .acc button.h svg{width:22px;height:22px;transition:transform .2s;color:var(--ink)}
  .acc.open button.h svg{transform:rotate(180deg)}
  .acc .body{display:none;padding:0 20px 22px;font-size:14px;line-height:1.7;color:var(--ink)}
  .acc.open .body{display:block}
  .acc .body dl{margin:0;display:grid;grid-template-columns:120px 1fr;gap:10px 12px}
  .acc .body dt{color:var(--muted)} .acc .body dd{margin:0;color:var(--ink-strong)}
  .sfoot{padding:20px 20px 150px;font-size:11.5px;color:var(--faint);line-height:1.55;border-top:1px solid var(--line)}
  .cta{display:flex;align-items:center;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);position:relative;z-index:5}
  .cta button{height:52px;border-radius:12px;font-size:16px;font-weight:600}
  .cta .one{flex:1;background:var(--green-soft);color:var(--green)}
  .cta .sip{flex:1;background:var(--green);color:#fff}
  .cta .fbtn{flex:none;width:60px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;padding:0}
  .cta .fbtn img{width:44px;height:40px;display:block}
  .cta .fbtn:active{background:#fafafc}
  .cta .lbl{position:absolute;left:16px;bottom:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:12.5px;color:var(--ink-strong);box-shadow:0 6px 18px rgba(30,32,50,.12);opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s;pointer-events:none;white-space:nowrap}
  .cta .lbl.show{opacity:1;transform:none}
  .toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink-strong);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}


  /* Fund chat sheet */
  .scrim{position:absolute;inset:0;background:rgba(20,22,40,.38);z-index:40;opacity:0;transition:opacity .25s}
  .scrim.show{opacity:1}
  .sheet{position:absolute;left:0;right:0;bottom:0;height:86%;background:#fff;border-radius:22px 22px 0 0;z-index:41;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(20,22,40,.2)}
  .sheet.show{transform:none}
  .sh-top{display:flex;align-items:center;gap:12px;padding:16px 16px 12px 18px;border-bottom:1px solid var(--line)}
  .sh-top img{width:40px;height:36px}
  .sh-top .tt{flex:1;min-width:0}
  .sh-top .tt b{display:block;font-size:15.5px;font-weight:600;color:var(--ink-strong)}
  .sh-top .tt span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sh-body{flex:1;min-height:0;overflow-y:auto;padding:16px 18px 8px}
  .sh-body::-webkit-scrollbar{display:none}
  .intro{background:#f6f7fa;border-radius:14px;padding:13px 14px;font-size:13px;line-height:1.55;color:var(--ink)}
  .intro b{color:var(--ink-strong)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:13.5px;color:var(--ink-strong);background:#fff}
  .chip:active{background:#f3f3f6}
  .msg{display:flex;margin:14px 0}
  .msg.u{justify-content:flex-end}
  .bub{max-width:86%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.55}
  .msg.u .bub{background:var(--green-soft);color:var(--ink-strong);border-bottom-right-radius:5px}
  .msg.b .bub{background:#f6f7fa;color:var(--ink-strong);border-bottom-left-radius:5px}
  .bub .lb{display:block;font-weight:600;margin-bottom:5px}
  .bub ul{margin:0;padding-left:18px}
  .bub .src{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid #e6e7ee;font-size:11.5px;color:var(--muted)}
  .badge{display:inline-flex;align-items:center;gap:4px;background:#e8f6f1;color:#0a8f6c;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:600}
  .badge.warn{background:#f1f1f5;color:var(--muted)}
  .dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-right:4px;animation:bl 1s infinite}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .sh-in{display:flex;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .sh-in input{flex:1;height:46px;border:1px solid var(--line);border-radius:23px;padding:0 16px;font:inherit;font-size:14.5px;color:var(--ink-strong);outline:none}
  .sh-in input:focus{border-color:var(--green)}
  .sh-in button{width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
  .sh-note{padding:0 18px 6px;font-size:11px;color:var(--faint);text-align:center}


  /* SIP screen */
  .sipwrap{flex:1;min-height:0;display:flex;flex-direction:column}
  .sip-h{padding:20px 14px 0;display:flex;align-items:flex-start;gap:6px}
  .sip-h .tx{padding-top:3px}
  .sip-h b{display:block;font-size:19px;font-weight:600;color:var(--ink-strong)}
  .sip-h span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  .amt{text-align:center;margin-top:46px}
  .amt small{font-size:14px;color:var(--muted)}
  .amt .v{margin-top:8px;font-size:48px;font-weight:600;color:var(--ink-strong);letter-spacing:-.02em;line-height:1.1}
  .amt .v.zero{color:#b4b6c1}
  .amt .hint{height:18px;margin-top:8px;font-size:12.5px;color:var(--muted)}
  .addrow{display:flex;justify-content:center;gap:10px;margin-top:16px}
  .addrow button{display:flex;align-items:center;gap:6px;padding:10px 15px;border:1px solid var(--line);border-radius:999px;font-size:14.5px;color:var(--ink-strong);background:#fff}
  .addrow button:active{background:#f3f3f6}
  .daterow{display:flex;justify-content:center;margin-top:26px}
  .daterow button{display:flex;align-items:center;gap:10px;padding:11px 16px;border:1px solid var(--line);border-radius:12px;font-size:14.5px;font-weight:500;color:var(--ink-strong)}
  .daterow svg{width:18px;height:18px}
  .pay{margin-top:auto;display:flex;align-items:center;gap:14px;padding:16px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .pay .bk{width:40px;height:40px;border-radius:50%;background:#eef0f6;display:grid;place-items:center;color:var(--blue)}
  .pay .tx{flex:1}.pay .tx b{display:block;font-size:15px;font-weight:600;color:var(--ink-strong)}.pay .tx span{font-size:12.5px;color:var(--muted)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);padding:4px 10px}
  .pad button{height:58px;font-size:26px;font-weight:500;color:var(--ink-strong);border-radius:12px}
  .pad button:active{background:#f3f3f6}
  .pad button.off{color:#c9cad3}
  .sipcta{padding:8px 16px calc(14px + env(safe-area-inset-bottom))}
  .sipcta button{width:100%;height:52px;border-radius:12px;background:var(--green);color:#fff;font-size:16px;font-weight:600}
  .sipcta button:disabled{background:#d9efe8;color:#fff}
  .dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:6px 16px 8px}
  .dgrid button{height:42px;border-radius:10px;font-size:15px;color:var(--ink-strong);border:1px solid transparent}
  .dgrid button.on{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
  .qsheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;z-index:41;padding:22px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(20,22,40,.2)}
  .qsheet.show{transform:none}
  .qsheet h3{margin:0 0 8px;font-size:19px;font-weight:600;color:var(--ink-strong)}
  .qsheet p{margin:0 0 20px;font-size:14px;line-height:1.6;color:var(--ink)}
  .qsheet .pri{width:100%;height:52px;border-radius:12px;background:var(--green);color:#fff;font-size:16px;font-weight:600}
  .qsheet .sec2{width:100%;height:46px;margin-top:6px;font-size:15px;font-weight:500;color:var(--muted)}
  .qsheet .done{text-align:center;padding:18px 0 8px}
  .qsheet .done svg{width:56px;height:56px;margin:0 auto 12px}
  .qsheet .done b{font-size:17px;color:var(--ink-strong)}
  .spin{width:44px;height:44px;margin:6px auto 16px;border-radius:50%;border:4px solid #e6f7f2;border-top-color:var(--green);animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}


  /* payment success and course invitation */
  .okwrap{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:96px;text-align:center;position:relative;background:#fff}
  .okwrap .x{position:absolute;left:12px;top:20px}
  .tick{width:84px;height:84px}
  .tick circle{fill:none;stroke:var(--green);stroke-width:4;stroke-dasharray:252;stroke-dashoffset:252;animation:draw .7s ease-out .1s forwards}
  .tick path{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s ease-out .75s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .okwrap>h2{margin:24px 0 6px;font-size:22px;font-weight:600;color:var(--ink-strong);opacity:0;animation:fadeup .5s ease-out 1s forwards}
  .okwrap>p{margin:0;font-size:14.5px;line-height:1.6;color:var(--muted);opacity:0;animation:fadeup .5s ease-out 1.15s forwards}
  .okwrap .demo{margin-top:22px;font-size:11.5px;color:var(--faint);opacity:0;animation:fadeup .5s ease-out 1.3s forwards}
  @keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .invite{position:absolute;left:10px;right:10px;bottom:10px;max-height:calc(100% - 96px);border-radius:28px;background:linear-gradient(180deg,#fff 0%,#f4fbf8 100%);border:1px solid #e0f2ec;box-shadow:0 24px 60px rgba(20,60,50,.16);transform:translateY(115%);opacity:0;transition:transform .7s cubic-bezier(.2,.9,.2,1),opacity .5s;z-index:10;display:flex;flex-direction:column;text-align:center}
  .invite.show{transform:none;opacity:1}
  .okwrap.covered .tick,.okwrap.covered>h2,.okwrap.covered>p,.okwrap.covered .demo{opacity:0!important;transition:opacity .5s}
  .badge1{position:absolute;left:50%;top:-52px;width:104px;height:104px;margin-left:-52px;z-index:2}
  .badge1 svg{width:104px;height:104px;overflow:visible;filter:drop-shadow(0 10px 18px rgba(0,179,134,.22))}
  .badge1 .trk{fill:#fff;stroke:#e3f4ee;stroke-width:6}
  .badge1 .prg{fill:none;stroke:url(#gr);stroke-width:6;stroke-linecap:round;stroke-dasharray:289;stroke-dashoffset:289;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1) .35s}
  .invite.show .prg{stroke-dashoffset:217}
  .badge1 .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
  .badge1 .in img{width:62px;height:62px;display:block;filter:drop-shadow(0 4px 6px rgba(120,80,0,.25))}
  .badge1 .in b{font-size:30px;font-weight:700;color:var(--ink-strong)}
  .badge1 .in small{display:block;margin-top:4px;font-size:9.5px;letter-spacing:.14em;color:var(--green);font-weight:700}
  .inv-scroll{flex:1;min-height:0;overflow-y:auto;padding:6px 26px 6px}
  .inv-scroll::-webkit-scrollbar{display:none}
  .inv-top{flex:none;height:64px}
  .tagchip{display:inline-block;padding:7px 14px;border-radius:999px;background:#e8f7f2;color:#0a8f6c;font-size:10.5px;font-weight:700;letter-spacing:.12em}
  .invite h3{margin:14px 0 6px;font-size:23px;white-space:nowrap;line-height:1.22;font-weight:600;color:var(--ink-strong);letter-spacing:-.02em}
  .invite .sub{margin:0 0 20px;font-size:14px;line-height:1.5;color:var(--muted);white-space:nowrap}
  .rows{text-align:left;border-top:1px solid #e8efed}
  .rowb{display:flex;align-items:center;gap:16px;width:100%;padding:18px 2px;border-bottom:1px solid #e8efed;text-align:left}
  .rowb:active{background:rgba(0,179,134,.04)}
  .rowb .ri{width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid #e3efeb;display:grid;place-items:center;color:#0a8f6c;flex:none}
  .rowb .rt2{flex:1;min-width:0}
  .rowb .rt2 b{display:block;font-size:15.5px;font-weight:600;color:var(--ink-strong)}
  .rowb .rt2 span{display:block;margin-top:3px;font-size:13px;color:var(--muted)}
  .rowb .ch{color:var(--faint);width:20px;height:20px;transform:rotate(-90deg);flex:none}
  .inv-cta{padding:16px 26px 16px}
  .inv-cta .go{width:100%;height:56px;border-radius:16px;background:var(--green);color:#fff;font-size:16.5px;font-weight:600;box-shadow:0 10px 24px rgba(0,179,134,.26)}
  .inv-cta .later{width:100%;height:40px;margin-top:4px;font-size:14.5px;color:var(--muted);font-weight:500}
  .lbcard{text-align:left;background:#fff;border:1px solid #e3efeb;border-radius:20px;padding:16px 16px 12px;margin:0 0 14px;box-shadow:0 8px 24px rgba(20,60,50,.06)}

  '3Y':[[0,.05],[.08,.18],[.15,.2],[.22,.38],[.3,.55],[.34,.52],[.4,.28],[.44,.3],[.5,.45],[.56,.6],[.62,.55],[.68,.5],[.72,.28],[.76,.35],[.82,.62],[.88,.82],[.93,1],[.97,.92],[1,.82]],

  'ALL':[[0,.02],[.1,.08],[.25,.2],[.4,.15],[.55,.35],[.7,.5],[.8,.42],[.9,.8],[1,.9]]

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function chartPath(range,seed,W,H){
  const sh=SHAPES[range], N=140, r=rng(seed*7+range.length*31+range.charCodeAt(0)), pts=[];
  let walk=0;
  for(let i=0;i<N;i++){
    const x=i/(N-1); let k=1; while(k<sh.length-1&&sh[k][0]<x)k++;
    const [x0,y0]=sh[k-1],[x1,y1]=sh[k], u=x1===x0?0:(x-x0)/(x1-x0), base=y0+(y1-y0)*u;
    walk=walk*0.8+(r()-.5)*0.05; pts.push(base+walk);
  }
  const mn=Math.min(...pts), mx=Math.max(...pts), pad=10;
  return pts.map((y,i)=>{const px=pad+(W-2*pad)*i/(N-1), py=H-pad-((y-mn)/(mx-mn))*(H-2*pad);return(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}).join('');
}

/* ---------- Ask the Coach orb (frames from the supplied Groww orb file, cross-faded on a canvas) ---------- */
function startOrb(canvas){
  const ORB_SET='o';   // 'o' = original colours cut to the ring; 's' = earlier see-through version (to revert, change to 's')
  const SRC=[0,1,2,3,4].map(i=>'assets/orb/'+ORB_SET+i+'.png');
  const ORDER=[4,3,2,1,0], WEIGHTS=[1,1,1.4,1,1], CYCLE=6000;
  const total=WEIGHTS.reduce((a,b)=>a+b,0), cum=[]; WEIGHTS.reduce((a,w,i)=>(cum[i]=a+w,a+w),0);
  const ctx=canvas.getContext('2d');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr=Math.min(devicePixelRatio||1,2), S=canvas.clientWidth||62;
  canvas.width=canvas.height=Math.round(S*dpr);
  const imgs=SRC.map(s=>{const i=new Image();i.src=s;return i});
  let ready=false;
  Promise.all(imgs.map(i=>i.decode().catch(()=>{}))).then(()=>{ready=true; if(reduced) draw(0)});
  const smooth=t=>t*t*(3-2*t);
  const CROP={x:0,y:0,w:300,h:300};             // sphere-only frames (transparent background)
  function slot(t){const x=t*total;let i=0;while(i<cum.length-1&&x>cum[i])i++;const s=i?cum[i-1]:0;return{i,f:(x-s)/WEIGHTS[i]}}
  function draw(now){
    if(!reduced) requestAnimationFrame(draw);
    if(!ready) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const t=reduced?0.45:(now%CYCLE)/CYCLE, {i,f}=slot(t), a=ORDER[i], b=ORDER[(i+1)%ORDER.length], e=smooth(f);
    ctx.globalAlpha=1; ctx.drawImage(imgs[a],CROP.x,CROP.y,CROP.w,CROP.h,0,0,canvas.width,canvas.height);
    ctx.globalAlpha=e; ctx.drawImage(imgs[b],CROP.x,CROP.y,CROP.w,CROP.h,0,0,canvas.width,canvas.height);
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(draw);
}

const PII_RE=[/\b[A-Z]{5}[0-9]{4}[A-Z]\b/,/\b\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}\b/,/\b\d{4}[\s-]?\d{4}[\s-]?\d{4}\b/,/\b(?:\+?91[\s-]?|0)?[6-9](?:[\s-]?\d){9}\b/,/\b[\w.%+-]+@[\w.-]+\.[a-z]{2,}\b/i,/\b(otp|password|cvv|account\s*(no|number))\b/i];
const ADVICE_RE=/\b(should i|which (fund|scheme|one)|best|better|recommend|buy|sell|switch|worth|good (fund|time|idea|investment)|will (it|this).*(return|give)|how much will i (get|earn)|what will i get|invest .*for \d+ years)\b/i;
const OTHER_RE=/\b(compare|versus|vs\.?|hdfc|sbi|axis|icici|nippon|quant|bandhan|hsbc|kotak|other (fund|scheme)|large cap fund|multicap fund|multi cap fund|elss tax saver)\b/i;
const NEWS_RE=/\b(news|market today|nifty|sensex|today|stock|weather|joke|capital of)\b/i;
function fundAnswer(q,s){
  const src='Groww scheme page, fetched 26 Aug 2026';
  if(PII_RE.some(r=>r.test(q))) return {kind:'pii',text:"I can't use personal details like PAN, phone numbers, email or account numbers, so please don't share them here. I only share facts from this fund's official documents."};
  const own=s.name.toLowerCase();
  const mentionsOther=OTHER_RE.test(q)&&!(new RegExp(own.replace(/groww /,'').replace(/ fund$/,'').replace(/\s+/g,'\\s*'),'i').test(q)&&!/\b(compare|versus|vs\.?|better|other)\b/i.test(q));
  if(/\b(compare|versus|vs\.?|better than|other (fund|scheme))\b/i.test(q)||(OTHER_RE.test(q)&&!/this (fund|scheme)/i.test(q)&&!new RegExp(s.cat.replace(/ /g,'\\s*'),'i').test(q))) return {kind:'decline',text:"I can only answer about "+s.name+". I can't compare funds or share details of any other fund. Ask me about this fund's benchmark, expense ratio, exit load, minimum SIP, risk level or published returns."};
  if(ADVICE_RE.test(q)) return {kind:'decline',text:"I can't give investment advice, suggestions or forecasts, so I can't say whether to invest or what you might earn. I can share facts about this fund. For guidance on evaluating funds, see SEBI's investor education page: https://investor.sebi.gov.in/"};
  if(NEWS_RE.test(q)&&!/\b(benchmark|nifty \d+)\b/i.test(q)) return {kind:'decline',text:"I only answer about "+s.name+". For market questions, the Ask the Coach button can help."};
  const out=(label,items)=>({kind:'answer',label:label+' — '+s.name,items,src});
  if(/expense|\bter\b/i.test(q)) return out('Expense ratio',[s.er]);
  if(/exit load|redemption|redeem/i.test(q)) return out('Exit load',[s.exit]);
  if(/min(imum)?.*(sip|invest)|sip amount|lowest/i.test(q)) return out('Minimum SIP',[s.minSip]);
  if(/benchmark|index/i.test(q)) return out('Benchmark',[s.bench]);
  if(/risk/i.test(q)) return out('Risk level',[s.risk]);
  if(/lock/i.test(q)) return s.id==='elss'?out('Lock-in',['3 years (ELSS statutory requirement)']):{kind:'nodoc',text:"A lock-in period is not stated in this scheme's document, so I can't say. Please check the official scheme document."};
  if(/aum|fund size|corpus|size/i.test(q)) return out('Fund size',[s.size]);
  if(/manager/i.test(q)) return out('Fund managers',s.mgrs);
  if(/return|perform|1y|3y|5y|inception/i.test(q)) return s.r3y==null?{kind:'nodoc',text:"The published returns for this scheme are not available in the data I have. Please check the official factsheet."}:{kind:'answer',label:'Published returns — '+s.name,items:['3-year annualised: +'+s.r3y.toFixed(2)+'% (as of '+s.asOf+')'],src,note:'Past performance may or may not be sustained. This is not a recommendation.'};
  if(/how long|horizon|holding|stay invested|years/i.test(q)) return {kind:'nodoc',text:"The holding period is not stated in the data I have for this scheme, so I can't say. Please check the official scheme document."};
  if(/launch|started|inception date/i.test(q)) return out('Launch date',[s.launch]);
  return {kind:'nodoc',text:"I don't have that in this scheme's document. I can answer about this fund's benchmark, expense ratio, exit load, minimum SIP, risk level, fund size, managers or published returns."};
}
function openFundChat(s){
  const scrim=document.createElement('div'); scrim.className='scrim';
  const sheet=document.createElement('div'); sheet.className='sheet';
  const chips=['What is the benchmark?','What is the expense ratio?','What is the exit load?','What is the minimum SIP?','What is the risk level?','What are the published returns?'];
  sheet.innerHTML=`
    <div class="sh-top"><img src="assets/fund-chat-still.png" alt=""><div class="tt"><b>Ask about this fund</b><span>${s.name}</span></div><button class="icon-btn" id="shX" aria-label="Close">${I.close}</button></div>
    <div class="sh-body" id="shBody">
      <div class="intro"><b>Facts about this fund only.</b> Answers come from its official documents, with the source shown. I can't give investment advice, compare funds or answer about other funds.</div>
      <div class="chips" id="shChips">${chips.map(c=>`<button class="chip">${c}</button>`).join('')}</div>
    </div>
    <div class="sh-note">Information only, not investment advice</div>
    <form class="sh-in" id="shForm"><input id="shIn" placeholder="Ask about this fund" autocomplete="off" maxlength="200"><button aria-label="Send">${I.send}</button></form>`;
  phone.appendChild(scrim); phone.appendChild(sheet);
  requestAnimationFrame(()=>{scrim.classList.add('show');sheet.classList.add('show')});
  const body=sheet.querySelector('#shBody'), input=sheet.querySelector('#shIn');
  const close=()=>{scrim.classList.remove('show');sheet.classList.remove('show');setTimeout(()=>{scrim.remove();sheet.remove()},300)};
  sheet.querySelector('#shX').onclick=close; scrim.onclick=close;
  const add=(cls,html)=>{const m=document.createElement('div');m.className='msg '+cls;m.innerHTML='<div class="bub">'+html+'</div>';body.appendChild(m);body.scrollTop=body.scrollHeight;return m};
  const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const linkify=x=>esc(x).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer" style="color:var(--blue)">$1</a>');
  const md=x=>esc(x).replace(/\*\*([^*]+)\*\*/g,'<span class="lb">$1</span>').replace(/(?:^|\n)- (.*)/g,(m,g)=>'\n<li>'+g+'</li>').replace(/(<li>[\s\S]*<\/li>)/,'<ul>$1</ul>').replace(/\n(?!<)/g,'<br>').replace(/<br><ul>/g,'<ul>').replace(/<\/span><br>/,'</span>');
  const ask=async q=>{
    q=q.trim(); if(!q) return;
    const chipsEl=sheet.querySelector('#shChips'); if(chipsEl) chipsEl.remove();
    add('u',esc(q)); const wait=add('b','<span class="dots"><span></span><span></span><span></span></span>');
    let r=null;
    try{ const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),40000); const res=await fetch('/api/fund-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scheme:s.id,message:q}),signal:ctl.signal}); clearTimeout(to); r=await res.json(); }catch(e){ r=null }
    wait.remove();
    if(!r||!r.answer){ const f=fundAnswer(q,s); r=f.kind==='answer'?{answer:'**'+f.label+'**\n'+f.items.map(i=>'- '+i).join('\n'),kind:'answer',sources:[{label:f.src,url:''}],checks:{numbers:'ok'}}:{answer:f.text,kind:f.kind==='nodoc'?'nodoc':'decline',sources:[],checks:{}} }
    const lnk=x=>x.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer" style="color:var(--blue)">$1</a>');
    if(r.kind==='answer'){
      const srcs=(r.sources||[]).map(x=>x.url?`<a href="${x.url}" target="_blank" rel="noopener noreferrer" style="color:var(--blue)">${esc(x.label)}</a>`:esc(x.label)).join(' · ');
      add('b',lnk(md(r.answer))+`<div class="src"><span class="badge">✓ Checked against the documents</span>${srcs?'<span>Source: '+srcs+'</span>':''}</div>`);
    } else {
      add('b',lnk(md(r.answer))+`<div class="src"><span class="badge warn">${r.kind==='nodoc'?'Not in the documents':'No advice · this fund only'}</span></div>`);
    }
  };
  sheet.querySelectorAll('.chip').forEach(c=>c.onclick=()=>ask(c.textContent));
  sheet.querySelector('#shForm').onsubmit=e=>{e.preventDefault();const v=input.value;input.value='';ask(v)};
}

function wireLesson(s,n){

  const draw=(back)=>{

    segs.forEach((e,k)=>e.classList.toggle('on',k<=i));
    nx.textContent=i===cards.length-1?(learner.quizOpen[n]?'Start the quick check':'Finish lesson'):'Next';
  };
  nx.onclick=()=>{ if(i<cards.length-1){i++;draw(false)} else endLesson(s,n) };

  draw(false);
}

  const show=(q)=>{

function startOrbDark(canvas){
  const SRC=[0,1,2,3,4].map(i=>'assets/orb/f'+i+'.webp'), ORDER=[4,3,2,1,0], WEIGHTS=[1,1,1.4,1,1], CYCLE=6000;
  const total=WEIGHTS.reduce((a,b)=>a+b,0), cum=[]; WEIGHTS.reduce((a,w,i)=>(cum[i]=a+w,a+w),0);
  const ctx=canvas.getContext('2d',{alpha:false}), dpr=Math.min(devicePixelRatio||1,2), S=canvas.clientWidth||150;
  canvas.width=canvas.height=Math.round(S*dpr);
  const imgs=SRC.map(s=>{const i=new Image();i.src=s;return i}); let ready=false;
  Promise.all(imgs.map(i=>i.decode().catch(()=>{}))).then(()=>{ready=true});
  const sm=x=>x*x*(3-2*x), reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const slot=u=>{const x=u*total;let i=0;while(i<cum.length-1&&x>cum[i])i++;const s=i?cum[i-1]:0;return{i,f:(x-s)/WEIGHTS[i]}};
  function draw(now){ if(!canvas.isConnected) return; if(!reduced) requestAnimationFrame(draw); if(!ready) return;
    ctx.globalCompositeOperation='source-over'; ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
    const u=reduced?0.45:(now%CYCLE)/CYCLE,{i,f}=slot(u),a=ORDER[i],b=ORDER[(i+1)%5],e=sm(f); ctx.globalCompositeOperation='lighter';
    [[a,1-e],[b,e]].forEach(([k,al])=>{ctx.globalAlpha=al;ctx.drawImage(imgs[k],100,40,425,425,0,0,canvas.width,canvas.height)}); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'}
  requestAnimationFrame(draw);
}

  const ask=async q=>{ q=q.trim(); if(!q||!coachPrefs.setup) return; add('u',esc(q)); hist.push({r:'u',t:q}); const wait=add('b','<span class="dots"><span></span><span></span><span></span></span>');
    let r=null;
    try{ const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),40000); const res=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,story:coachCtx.story,history:hist.slice(-5)}),signal:ctl.signal}); clearTimeout(to); r=await res.json(); }catch(e){ r=null }
    wait.remove();
    if(/\b(news list|list of news|latest news|show news)\b/i.test(q)){ showList(); return }
    if(!r||!r.answer){ const s=coachAnswer(q); r={answer:s.t,basis:s.w?'declined':'lessons',chapter:s.ch||0,followups:[],checks:{}} }
    hist.push({r:'c',t:r.answer});
    const txt=/<b>/.test(r.answer)?r.answer:esc(r.answer).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer" style="color:#7fe3c6">$1</a>');
    const warn=r.basis==='declined'||r.basis==='unsure', hasNum=/\d[\d,.]*\d/.test(r.answer)&&r.checks&&r.checks.numbers==='ok';
    const fu=(r.followups||[]).filter(Boolean).slice(0,2);
    const m=add('b',txt+`<div class="src2"><span class="bd ${bdKind(r.basis)}">${BD_ICON[bdKind(r.basis)]}${BASIS[r.basis]||'Checked'}</span>${hasNum?'<span class="bd chk">\u2713 Numbers checked</span>':''}</div>${lessonRow(r.chapter)}${fu.length?'<div class="fu">'+fu.map(f=>'<button class="fq">'+esc(f)+'</button>').join('')+'</div>':''}<button class="lst2">See market news list</button>`);
    wireLessonRow(m); m.querySelector('.lst2').onclick=showList; m.querySelectorAll('.fq').forEach(b=>b.onclick=()=>ask(b.textContent)); };
  phone.querySelector('#cform').onsubmit=e=>{e.preventDefault();const v=inp.value;inp.value='';ask(v)};
  phone.querySelector('#backBtn').onclick=()=>{ if(coachPrefs.setup) coachPrefs.pushDue=true; if(appNav>0) history.back(); else location.hash='#/' };
  if(coachPrefs.setup){ gate(); paintPill(); fetchNews() } else showSetup();
}

/* ---------- the daily brief push: animated banner on the home screen ---------- */
function mountBrief(){
  if(!coachPrefs.pushDue||!coachPrefs.on||learner.notif||phone.querySelector('#bnotif')) return;
  coachPrefs.pushDue=false;
  const el=document.createElement('button'); el.id='bnotif'; el.className='notif soft brief';
  el.innerHTML=`<img src="assets/logos/groww_symbol.png" alt=""><span class="nt"><b>Today’s market brief is ready</b><span>Six stories, explained in plain words. Tap to pick one.</span></span><small>${timePrefix()}</small>`;
  phone.appendChild(el); requestAnimationFrame(()=>el.classList.add('in'));
  try{ if(navigator.vibrate) navigator.vibrate(120) }catch(e){}
  el.onclick=()=>{el.remove();location.hash='#/coach'};
  setTimeout(()=>{ if(el.isConnected){el.classList.remove('in');setTimeout(()=>el.remove(),500)} },9000);
}


/* ---------- About this prototype: the mentor guide ---------- */
function screenAbout(){
  const card=(h,b)=>`<div class="ab"><h3>${h}</h3>${b}</div>`;
  const row=(a,b,c)=>`<div class="ar"><b>${a}</b><p><span>With AI</span>${b}</p><p><span>Without AI</span>${c}</p></div>`;
  return `<section class="screen" id="s-about"><div class="abt">
    <div class="hd"><button class="icon-btn" id="backBtn" aria-label="Back">${I.back}</button><h1>About this prototype</h1></div>
    <div class="sc">
      <p class="lead">Groww Gym Bot is a concept prototype from a PM graduation project. It is not the real Groww app, no real money moves, and nothing here is investment advice.</p>
      ${card('The problem it targets','<p>First-time mutual fund investors often stop their SIP within a year. In our survey of 24 investors, 71% turn to a friend or no one when worried, and those who expected results within a year were far more likely to pause or stop. The idea: help beginners learn as they invest, so they stay invested.</p>')}
      ${card('Try these three tasks','<ol><li><b>Ask about a fund.</b> Open a scheme, tap the chat icon in the bottom bar, ask a question, then try asking about another fund or for advice.</li><li><b>Start a SIP and learn.</b> Start a SIP, pay, accept the course, pick a nickname, read Lesson 1, take the quick check. Then go home for the next notification.</li><li><b>Ask the Coach.</b> Tap the orb, set up the Daily Market Brief, pick a news story and ask a follow-up.</li></ol>')}
      ${card('What is live and what is simulated','<div class="two"><div><b>Live AI</b><ul><li>Fund chat (answers from the scheme’s own documents)</li><li>Ask the Coach and the Daily Market Brief (real headlines and prices, explained in plain words)</li></ul></div><div><b>Simulated</b><ul><li>Payments, the SIP and its history</li><li>XP, levels, streak, leaderboard learners</li><li>The quick check questions (a fixed bank for now)</li><li>Months passing: notifications arrive when you return to the home screen</li></ul></div></div>')}
      ${card('Where AI earns its place, and what a non-AI version would miss','<div class="ars">'+row('Fund chat','Answers any question in the user’s own words, even typos or Hinglish, from that scheme’s documents, with the source shown.','A fixed FAQ answers only the questions someone thought of in advance, and cannot tell the user where in the document the answer sits.')+row('Coach and Daily Brief','Turns today’s real headlines and prices into plain words, links them to the lesson, and answers follow-ups at the moment of worry.','A plain news feed shows headlines and jargon, leaves a beginner alone with them, and cannot answer “what does this mean for my SIP?”.')+'</div><p class="nt">Lessons, XP, streaks and the leaderboard are deliberately not AI: they are fixed rules so progress is always fair.</p>')}
      ${card('Safety rules, enforced by code before and after the AI','<ul><li>Never advice, never a fund or stock pick, never a forecast.</li><li>Declines other funds and comparisons in the Fund chat, and anything about personal details (PAN, phone, card).</li><li>Current numbers come only from the live data. If a figure is missing it says so, and when unsure it points to SEBI or AMFI.</li><li>Every answer shows what it is based on and its source.</li><li>The timer exists only inside the learning quiz. No countdowns on offers, no loss messages.</li></ul>')}
      ${card('Quality check','<p>On our golden set, the Fund chat answered 30 of 30 and the Coach 16 of 16 as intended, after three rounds of fixes. These questions were used to tune the fixes, so a fresh set of new questions is the next check. Full table: GOLDEN_RESULTS in the project.</p>')}
      ${card('Known limits','<ul><li>Progress resets when the page is refreshed.</li><li>Leaderboard learners and the chart on the scheme page are sample data.</li><li>Chapters 4 to 18 are shown but locked; chapters 1 to 3 are built.</li><li>Prices come from an unofficial feed and may be delayed. Headlines come from named outlets and the AI explains only what the headline says.</li></ul>')}
      <button class="rst" id="rstBtn">Start the demo again</button>
      <div class="foot">Information only, not investment advice.</div>
    </div></div></section>`;
}
function wireAbout(){ phone.querySelector('#backBtn').onclick=()=>{ if(appNav>0) history.back(); else location.hash='#/' }; phone.querySelector('#rstBtn').onclick=()=>{ location.hash='#/'; location.reload() } }

/* ---------- placeholder for screens not built yet ---------- */
function screenPlaceholder(title){
  const m=location.hash.match(/^#\/quiz\/([^/]+)/);
  return `<section class="screen"><div class="top"><button class="icon-btn" id="backBtn" aria-label="Back">${I.back}</button><h1>${title}</h1></div><div class="ph">This screen is built in the next step.${m?`<br><br><a href="#/learn/${m[1]}" style="color:var(--green);font-weight:600">See all chapters</a>`:''}</div></section>`;
}

/* ---------- router ---------- */
function render(){
  if(phone._cleanup){phone._cleanup();phone._cleanup=null}
  const h=location.hash||'#/', parts=h.split('/'), s=SCHEMES.find(x=>x.id===parts[2]);
  const COURSE=['learn','lesson','quiz','nickname','done','success','month2'];
  const dev=/[?&]dev=1/.test(location.search);
  if(!dev){
    const has=Object.keys(holdings).length>0;
    if((COURSE.includes(parts[1])||parts[1]==='mysip')&&!has){ location.hash='#/'; setTimeout(()=>toast2('Start a SIP to begin the course'),400); return; }
    if(['lesson','quiz','learn','success','month2'].includes(parts[1])&&!learner.nick){ location.hash='#/nickname/'+(nudge.id||parts[2]||'large-cap'); return; }
    if(parts[1]==='sip'&&holdings[parts[2]]){ location.hash='#/mysip/'+parts[2]; return; }
  }
  let body, shell=true;
  if(parts[1]==='scheme'&&s){ body=screenScheme(s); shell=false; }
  else if(parts[1]==='sip'&&s){ body=screenSip(s); shell=false; }
  else if(parts[1]==='done'&&s){ body=screenDone(s); shell=false; }
  else if(parts[1]==='nickname'&&s){ body=screenNickname(s); shell=false; }
  else if(parts[1]==='lesson'&&s){ body=screenLesson(s,+parts[3]||1); shell=false; }
  else if(parts[1]==='quiz'&&s){ body=screenQuiz(s,+(parts[3]||'1').split('?')[0]||1); shell=false; }
  else if(parts[1]==='coach'){ body=screenCoach(); shell=false; }
  else if(parts[1]==='about'){ body=screenAbout(); shell=false; }
  else if(parts[1]==='learn'&&s){ body=screenLearn(s); shell=false; }
  else if(parts[1]==='mysip'&&s){ body=screenMySip(s); shell=false; }
  else if(parts[1]==='month2'&&s){ body=screenMonth2(s); shell=false; }
  else if(parts[1]==='success'&&s){ body=screenSuccess(s); shell=false; }
  else body=screenFundList();
  phone.innerHTML=body+(shell?navBar()+coachButton():(parts[1]==='scheme'?coachButton():''));
  const orb=phone.querySelector('#coach canvas'); if(orb) startOrb(orb);
  const back=phone.querySelector('#backBtn'); if(back) back.onclick=()=>{ if(parts[1]==='sip') location.hash='#/scheme/'+parts[2]; else if(parts[1]==='done') location.hash='#/'; else if(parts[1]==='mysip') { homeTab='sips'; location.hash='#/' } else if(parts[1]==='lesson') location.hash='#/nickname/'+parts[2]; else if(parts[1]==='quiz') location.hash='#/lesson/'+parts[2]+'/'+(parts[3]||1); else location.hash='#/' };
  phone.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{location.hash='#/scheme/'+b.dataset.open});
  if(parts[1]==='scheme'&&s) wireScheme(s);
  if(parts[1]==='sip'&&s){ if(!phone._sipFrom){sipState.amount='';} wireSip(s); }
  if(parts[1]==='done'&&s) wireDone(s);
  if(parts[1]==='nickname'&&s) wireNickname(s);
  if(parts[1]==='lesson'&&s) wireLesson(s,+parts[3]||1);
  if(parts[1]==='coach') wireCoach();
  if(parts[1]==='about') wireAbout();
  phone.querySelectorAll('.nav button:not(.on), [aria-label="Search"], [aria-label="Save"]').forEach(b=>b.onclick=()=>toast2('Not part of this demo'));
  const cb=phone.querySelector('#coach'); if(cb) cb.onclick=()=>{location.hash='#/coach'};
  if(parts[1]==='learn'&&s) wireLearn(s);
  if(parts[1]==='mysip'&&s) wireMySip(s);
  phone.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ if(b.dataset.tab==='watch'){toast2('Watchlist is not part of this demo');return} homeTab=b.dataset.tab; render() });
  phone.querySelectorAll('[data-mysip]').forEach(b=>b.onclick=()=>{location.hash='#/mysip/'+b.dataset.mysip});
  const ge=phone.querySelector('#goExplore'); if(ge) ge.onclick=()=>{homeTab='explore';render()};
  if(parts[1]==='month2'&&s) wireMonth2(s);
  if(parts[1]==='quiz'&&s) wireQuiz(s,+(parts[3]||'1').split('?')[0]||1);
  if(parts[1]==='success'&&s) wireSuccess(s);
  const lb=phone.querySelector('#learnBtn'); if(lb) lb.onclick=e=>{e.stopPropagation();location.hash='#/learn/'+(nudge.id||Object.keys(holdings)[0]||'large-cap')};
  const bell=phone.querySelector('#bellBtn'); if(bell) bell.onclick=e=>{e.stopPropagation();openBell()};
  if(nudge.banner) mountBanner();
  if(coachPrefs.pushDue && !parts[1]) setTimeout(()=>{ if(location.hash.replace('#','')==='/'||location.hash===''||location.hash==='#/') mountBrief(); },1500);
  if(learner.notif && !parts[1]) setTimeout(()=>{ if(!parts[1]&&location.hash.replace('#','')==='/'||location.hash===''||location.hash==='#/') mountMonthly(); },1300);
  if(splashActive&&splashEl&&!splashEl.isConnected) phone.appendChild(splashEl);
  const info=phone.querySelector('#infoBtn'), note=phone.querySelector('#note');
  if(info){info.onclick=e=>{e.stopPropagation();location.hash='#/about'}} phone.onclick=null;
}
let appNav=0; addEventListener('hashchange',()=>{appNav++;render()});
render();
showSplash();
</script>
