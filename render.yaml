services:
  - type: web
    name: groww-gym-bot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DAILY_CAP
        value: "300"
      - key: VISITOR_LIMIT
        value: "30"
